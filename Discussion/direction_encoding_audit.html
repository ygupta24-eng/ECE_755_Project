
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); font-size: 13px; color: var(--color-text-primary); }
.tabs { display: flex; gap: 6px; padding: 14px 0 10px; flex-wrap: wrap; }
.tab { padding: 5px 14px; border: 0.5px solid var(--color-border-secondary); border-radius: 20px;
       cursor: pointer; font-size: 12px; color: var(--color-text-secondary); background: var(--color-background-secondary); }
.tab.on { background: var(--color-background-info); color: var(--color-text-info); border-color: var(--color-border-info); font-weight: 500; }
.diagram-row { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
.grid-area { flex: 0 0 auto; }
.audit-area { flex: 1 1 280px; }
.audit-title { font-size: 12px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 8px; }
.pair-row { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; margin-bottom: 4px; font-size: 12px; }
.pair-row.ok  { background: var(--color-background-success); color: var(--color-text-success); }
.pair-row.err { background: var(--color-background-danger);  color: var(--color-text-danger);  }
.pair-row .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.pair-row.ok  .dot { background: var(--color-text-success); }
.pair-row.err .dot { background: var(--color-text-danger); }
.summary { margin-top: 10px; padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 500; }
.summary.all-ok  { background: var(--color-background-success); color: var(--color-text-success); }
.summary.has-err { background: var(--color-background-danger);  color: var(--color-text-danger); }
</style>

<div class="tabs">
  <button class="tab on" onclick="show('circular')">2'b11 Circular</button>
  <button class="tab"    onclick="show('hzig')">2'b10 Horizontal zigzag</button>
  <button class="tab"    onclick="show('vzig')">2'b01 Vertical zigzag</button>
</div>

<div class="diagram-row">
  <div class="grid-area">
    <svg id="svg" width="300" height="300" viewBox="0 0 300 300"></svg>
  </div>
  <div class="audit-area">
    <div class="audit-title">dst / src consistency check — every adjacent PE pair</div>
    <div id="audit"></div>
    <div id="summary" class="summary"></div>
  </div>
</div>

<script>
const CW=58, CH=52, GAP=10, OX=18, OY=18, ROWS=4, COLS=4;
function px(c){ return OX+c*(CW+GAP); }
function py(r){ return OY+r*(CH+GAP); }
function cx(c){ return px(c)+CW/2; }
function cy(r){ return py(r)+CH/2; }

// group assignment: top-left=0, top-right=1, bottom-left=2, bottom-right=3 within each 2x2 PEG
function grp(r,c){
  const lr = r%2, lc = c%2;
  if(lr===0 && lc===0) return 0;
  if(lr===0 && lc===1) return 1;
  if(lr===1 && lc===0) return 2;
  return 3;
}

// dst_sel encoding: 00=to_right, 01=to_left, 10=to_down, 11=to_up
// src_sel encoding: 00=from_left, 01=from_right, 10=from_up, 11=from_down
// Opposite map: if dst says "to X", the neighbour in direction X must have src "from opposite(X)"
// dst 00(right)  → neighbour at (r,c+1) must have src 00(from_left)
// dst 01(left)   → neighbour at (r,c-1) must have src 01(from_right)
// dst 10(down)   → neighbour at (r+1,c) must have src 10(from_up)
// dst 11(up)     → neighbour at (r-1,c) must have src 11(from_down)

const DST_DELTA = {'00':[0,1],'01':[0,-1],'10':[1,0],'11':[-1,0]};
const DST_NEEDS_SRC = {'00':'00','01':'01','10':'10','11':'11'};
// i.e. to_right(00) needs neighbour src from_left(00); to_left(01) needs from_right(01); to_down(10) needs from_up(10); to_up(11) needs from_down(11)

const DST_LABEL = {'00':'→ right','01':'← left','10':'↓ down','11':'↑ up'};
const SRC_LABEL = {'00':'from left','01':'from right','10':'from up','11':'from down'};

// Your exact encoding from the SV code
const MODES = {
  circular: {
    dst: ['10','01','00','11'],
    src: ['01','11','10','00'],
  },
  hzig: {
    dst: ['10','01','01','11'],
    src: ['01','11','10','01'],
  },
  vzig: {
    dst: ['11','01','00','11'],
    src: ['01','11','11','00'],
  }
};

// Arrow colors per group
const GCOL = ['#378ADD','#639922','#BA7517','#D4537E'];
const GFILL= ['#E6F1FB','#EAF3DE','#FAEEDA','#FBEAF0'];
const GTXT = ['#0C447C','#27500A','#633806','#72243E'];

function show(mode){
  document.querySelectorAll('.tab').forEach(b=>{
    b.classList.toggle('on',
      (mode==='circular'&&b.textContent.includes('11'))||
      (mode==='hzig'&&b.textContent.includes('10'))||
      (mode==='vzig'&&b.textContent.includes('01')&&!b.textContent.includes('10'))
    );
  });

  const m = MODES[mode];
  const svg = document.getElementById('svg');
  svg.innerHTML = '';

  // marker
  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  defs.innerHTML = `<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>`;
  svg.appendChild(defs);

  // draw cells
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const g=grp(r,c);
    const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('x',px(c)); rect.setAttribute('y',py(r));
    rect.setAttribute('width',CW); rect.setAttribute('height',CH);
    rect.setAttribute('rx',6);
    rect.setAttribute('fill',GFILL[g]); rect.setAttribute('stroke',GCOL[g]); rect.setAttribute('stroke-width','1.2');
    svg.appendChild(rect);
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',cx(c)); t.setAttribute('y',py(r)+16);
    t.setAttribute('text-anchor','middle'); t.setAttribute('dominant-baseline','central');
    t.setAttribute('font-size','11'); t.setAttribute('font-weight','500'); t.setAttribute('fill',GTXT[g]);
    t.textContent=`PE${r}${c}`;
    svg.appendChild(t);
    const t2=document.createElementNS('http://www.w3.org/2000/svg','text');
    t2.setAttribute('x',cx(c)); t2.setAttribute('y',py(r)+30);
    t2.setAttribute('text-anchor','middle'); t2.setAttribute('dominant-baseline','central');
    t2.setAttribute('font-size','9'); t2.setAttribute('fill',GTXT[g]);
    t2.textContent=`dst:${DST_LABEL[m.dst[g]]}`;
    svg.appendChild(t2);
    const t3=document.createElementNS('http://www.w3.org/2000/svg','text');
    t3.setAttribute('x',cx(c)); t3.setAttribute('y',py(r)+42);
    t3.setAttribute('text-anchor','middle'); t3.setAttribute('dominant-baseline','central');
    t3.setAttribute('font-size','9'); t3.setAttribute('fill',GTXT[g]);
    t3.textContent=`src:${SRC_LABEL[m.src[g]]}`;
    svg.appendChild(t3);
  }

  // draw arrows and collect audit
  const audit = [];
  const drawn = new Set();

  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const g=grp(r,c);
    const dst=m.dst[g];
    const [dr,dc]=DST_DELTA[dst];
    const nr=r+dr, nc=c+dc;
    if(nr<0||nr>=ROWS||nc<0||nc>=COLS) continue;

    const ng=grp(nr,nc);
    const needSrc=DST_NEEDS_SRC[dst];
    const actualSrc=m.src[ng];
    const ok = actualSrc===needSrc;

    // draw arrow
    const x1=cx(c), y1=cy(r), x2=cx(nc), y2=cy(nr);
    const dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy);
    const nx2=dx/len,ny2=dy/len;
    const sx=x1+nx2*30,sy=y1+ny2*28,ex=x2-nx2*30,ey=y2-ny2*28;
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',sx);line.setAttribute('y1',sy);
    line.setAttribute('x2',ex);line.setAttribute('y2',ey);
    line.setAttribute('stroke',ok?GCOL[g]:'#E24B4A');
    line.setAttribute('stroke-width',ok?'1.8':'2.5');
    line.setAttribute('marker-end','url(#ar)');
    if(!ok) line.setAttribute('stroke-dasharray','4 3');
    svg.appendChild(line);

    const key=`${Math.min(r,nr)}${Math.min(c,nc)}-${Math.max(r,nr)}${Math.max(c,nc)}-${dst}`;
    if(!drawn.has(key)){
      drawn.add(key);
      audit.push({
        from:`PE${r}${c}`, to:`PE${nr}${nc}`,
        senderDst: DST_LABEL[dst],
        receiverSrc: SRC_LABEL[actualSrc],
        expectedSrc: SRC_LABEL[needSrc],
        ok
      });
    }
  }

  const html=audit.map(a=>`
    <div class="pair-row ${a.ok?'ok':'err'}">
      <div class="dot"></div>
      <span><b>${a.from}→${a.to}</b>: sends ${a.senderDst}, receiver expects ${a.expectedSrc}, got "${a.receiverSrc}" ${a.ok?'✓':'✗'}</span>
    </div>`).join('');
  document.getElementById('audit').innerHTML=html;

  const errs=audit.filter(a=>!a.ok);
  const sumEl=document.getElementById('summary');
  if(errs.length===0){
    sumEl.className='summary all-ok';
    sumEl.textContent=`All ${audit.length} pairs consistent — encoding is correct`;
  } else {
    sumEl.className='summary has-err';
    sumEl.textContent=`${errs.length} mismatch(es) found in ${audit.length} pairs`;
  }
}
show('circular');
</script>
